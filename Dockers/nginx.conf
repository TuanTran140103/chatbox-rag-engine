events {
    worker_connections 1024;
}

http {
    # Tối ưu hóa các tham số kết nối
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream authentik_backend {
        server server:9000;
    }

    # 1. Chuyển hướng HTTP sang HTTPS
    server {
        listen 80;
        server_name auth.persisttuan.site;
        return 301 https://$host$request_uri;
    }

    # 2. Cấu hình HTTPS chính
    server {
        listen 443 ssl;
        http2 on; # Bật HTTP2 nếu Nginx version hỗ trợ
        server_name auth.persisttuan.site;

        ssl_certificate /etc/nginx/certs/origin.crt;
        ssl_certificate_key /etc/nginx/certs/origin.key;

        # Cấu hình SSL bảo mật
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Tăng kích thước bộ đệm để tránh lỗi 404/502 khi header quá lớn
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        client_max_body_size 50M;

        location / {
            proxy_pass http://authentik_backend;
            proxy_http_version 1.1;

            # Các Header quan trọng để Authentik nhận diện đúng Domain và SSL
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https; # Ép HTTPS để tránh redirect loop
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Cấu hình WebSocket (Bắt buộc cho Authentik)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeout cấu hình
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
    }
}
