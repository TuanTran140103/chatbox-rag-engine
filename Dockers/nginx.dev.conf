events {
    worker_connections 1024;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_http_version 1.1;

    upstream main-api {
        server host.docker.internal:5184;
    }

    upstream llm-service {
        server host.docker.internal:8000;
    }

    upstream frontend {
        server host.docker.internal:3000;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 100M;

        # ============ Auth validation (internal) ============
        location = /_auth/validate {
            internal;
            proxy_pass http://main-api/api/auth/validate;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
        }

        # ============ Main API ============
        location /api/ {
            proxy_pass http://main-api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # ============ LLM Service ============
        location /api/llm/ {
            rewrite ^/api/llm/(.*) /$1 break;

            auth_request /_auth/validate;
            auth_request_set $user_id $upstream_http_x_user_id;

            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Id $user_id;
            proxy_pass http://llm-service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============ Frontend (Next.js) ============
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Next.js HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
